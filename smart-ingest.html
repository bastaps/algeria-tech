<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ingest — Algeria Tech</title>
    <!-- Font Awesome async — non-bloquant -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="/smart-ingest.css">
</head>
<body>

<div class="si-app">
    <header class="si-header">
        <div class="si-header-left">
            <div class="si-logo-icon"><i class="fas fa-brain"></i></div>
            <div>
                <h1 class="si-title">Smart Ingest</h1>
                <p class="si-subtitle">Moteur de rédaction IA</p>
            </div>
        </div>
        <div class="si-header-right">
            <div class="si-status-dot online"></div>
            <a href="index.html" class="si-back-btn"><i class="fas fa-arrow-left"></i> Retour au site</a>
        </div>
    </header>

    <div class="si-positions-bar">
        <i class="fas fa-layer-group"></i> <span>Actuellement en Une :</span>
        <div id="positionsSlots"></div>
    </div>

    <main class="si-main-grid">
        <div class="si-col-left">
            <div class="si-card">
                <div class="si-card-head">
                    <span class="si-card-icon"><i class="fas fa-inbox"></i></span>
                    <div><h2>Dépôt Magique</h2><p>Collez vos communiqués bruts ou importez une URL</p></div>
                </div>
                <div class="si-url-row">
                    <input type="url" id="urlInput" class="si-url-input" placeholder="https://www.01net.com/actualites/...">
                    <button id="urlBtn" class="si-btn si-btn-web" onclick="fetchFromUrl()">
                        <i class="fas fa-globe"></i> <span>Importer</span>
                    </button>
                </div>
                <div id="sourceBadge" class="si-source-badge hidden"></div>
                <textarea id="smartBox" class="si-smart-box" placeholder="Collez le texte source ici (Arabe, Anglais ou Français)..."></textarea>
                <div class="si-char-count" id="charCount">0 caractères</div>
                
                <div class="si-btn-3grid">
                    <button id="pdfBtn" class="si-btn si-btn-primary" onclick="document.getElementById('pdfInput').click()">
                        <i class="fas fa-file-pdf"></i> <span>PDF</span>
                    </button>
                    <input type="file" id="pdfInput" accept=".pdf" style="display:none" onchange="transcribePDF(this)">
                    <button id="translateBtn" class="si-btn si-btn-primary" onclick="translateContent()">
                        <i class="fas fa-language"></i> <span>Traduire</span>
                    </button>
                    <button id="genBtn" class="si-btn si-btn-primary" onclick="generateProArticle()">
                        <i class="fas fa-pen-nib"></i> <span>Générer</span>
                    </button>
                    <button id="fillHubBtn" class="si-btn si-btn-primary" onclick="fillHub()">
                        <i class="fas fa-fill-drip"></i> <span>Remplir</span>
                    </button>
                </div>

                <div class="si-style-selector" id="styleSelector">
                    <label class="si-style-label"><i class="fas fa-feather-alt"></i> Style de rédaction :</label>
                    <div class="si-style-options">
                        <button type="button" class="si-style-btn active" data-style="aps">
                            <i class="fas fa-landmark"></i>
                            <strong>APS</strong>
                            <small>Agence — formel, sections</small>
                        </button>
                        <button type="button" class="si-style-btn" data-style="pro">
                            <i class="fas fa-feather-alt"></i>
                            <strong>Pro</strong>
                            <small>Étoffé — magazine, analyse</small>
                        </button>
                        <button type="button" class="si-style-btn" data-style="breve">
                            <i class="fas fa-bolt"></i>
                            <strong>Brève</strong>
                            <small>3 paragraphes max</small>
                        </button>
                    </div>
                </div>


                <div id="previewZone" class="si-preview-zone hidden">
                    <div class="si-preview-head">
                        <span><i class="fas fa-eye"></i> RÉDACTION IA (APERÇU)</span>
                        <span class="si-preview-hint">Édition Markdown autorisée</span>
                    </div>
                    <textarea id="previewContent" class="si-preview-textarea"></textarea>
                </div>
            </div>
        </div>

        <div class="si-col-right">
            <form id="smartIngestForm" onsubmit="deployArticle(event)">
                <div class="si-card si-form-card">
                    <div class="si-field">
                        <label><i class="fas fa-heading"></i> Titre de l'article</label>
                        <input type="text" id="siTitre" name="titre" required>
                    </div>
                    
                    <div class="si-field-row">
                        <div class="si-field">
                            <label><i class="fas fa-tag"></i> Catégorie</label>
                            <select id="siCategorie" name="categorie">
                                <option value="Algérie">Algérie</option>
                                <option value="Télécoms">Télécoms</option>
                                <option value="Mobile">Mobile</option>
                                <option value="Startups">Startups</option>
                                <option value="IA">IA</option>
                                <option value="Fintech">Fintech</option>
                                <option value="Innovation">Innovation</option>
                                <option value="Monde">Monde</option>
                                <option value="Entreprises">Entreprises</option>
                                <option value="Vidéo">Vidéo</option>
                                <option value="Infographies">Infographies</option>
                            </select>
                        </div>
                        <div class="si-field"><label>Date</label><input type="date" id="siDate" name="date" required></div>
                        <div class="si-field"><label>Heure</label><input type="time" id="siHeure" name="heure" required></div>
                    </div>

                    <div class="si-field">
                        <label><i class="fas fa-tags"></i> Tags (séparés par des virgules)</label>
                        <input type="text" id="siTags" name="tags" placeholder="ex: 5G, Algérie Télécom, Cloud">
                    </div>

                    <div class="si-field-row">
                        <div class="si-field">
                            <label><i class="fas fa-thumbtack"></i> Position à la Une</label>
                            <select id="siPosition" name="position">
                                <option value="">Automatique (par date)</option>
                                <option value="1">Position 1 — Une principale</option>
                                <option value="2">Position 2 — Une secondaire</option>
                            </select>
                        </div>
                        <div class="si-field" style="display:flex;align-items:center;gap:8px;padding-top:22px;">
                            <label style="display:flex;align-items:center;gap:6px;font-weight:normal;cursor:pointer;">
                                <input type="checkbox" id="siBreve" name="isBreve" style="width:auto;">
                                <i class="fas fa-bolt"></i> Publier en Brèves (bandeau, pas en Une)
                            </label>
                        </div>
                    </div>

                    <div class="si-field">
                        <label>Résumé SEO / Extrait</label>
                        <textarea id="siExtrait" name="extrait" rows="2" required></textarea>
                    </div>

                    <div class="si-field">
                        <label>Contenu Final (Markdown)</label>
                        <textarea id="siContenu" name="contenu" rows="10" required></textarea>
                    </div>

                    <div class="si-field-row" style="grid-template-columns: 1fr 1fr;">
                        <div class="si-field">
                            <label><i class="fas fa-image"></i> Illustration</label>
                            <input type="file" id="siImage" name="image" accept="image/*" onchange="previewSIImage(event)">
                            <div id="siImagePreview" class="si-img-preview hidden"></div>
                        </div>
                        <div class="si-field">
                            <label><i class="fab fa-youtube"></i> Vidéo / Réseaux Sociaux</label>
                            <input type="url" id="siVideo" name="video" placeholder="Lien YouTube, FB, TikTok...">
                        </div>
                    </div>
                    <div class="si-field">
                        <label><i class="fas fa-link"></i> Source originale</label>
                        <input type="url" id="siSource" name="source" placeholder="https://...">
                    </div>
                </div>

                <button type="submit" class="si-deploy-btn" id="deployBtn">
                    <div class="si-deploy-inner"><i class="fas fa-rocket"></i> DÉPLOYER SUR ALGERIA TECH</div>
                </button>
            </form>
        </div>
    </main>
</div>

<!-- Modal de succès -->
<div id="siSuccessModal" class="si-modal-overlay hidden">
    <div class="si-modal-box">
        <div class="si-modal-rocket">🚀</div>
        <h2>Article Propulsé !</h2>
        <p>Votre dépêche est maintenant en ligne sur le portail.</p>
        <button class="si-btn si-btn-primary" onclick="location.reload()">Rédiger un autre article</button>
    </div>
</div>

<script src="/smart-ingest.js"></script>
</body>
</html>
