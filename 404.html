<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Page introuvable - Algeria Tech</title>
<style>
  :root{--bg:#f6f7f4;--card:#fff;--ink:#14231b;--mute:#5b6b62;--vert:#006233;--rouge:#d21034}
  @media (prefers-color-scheme:dark){:root{--bg:#0f1713;--card:#17231c;--ink:#e8efe9;--mute:#9bb0a3;--vert:#2fa86b}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;width:100%;background:var(--card);border-radius:16px;padding:32px 24px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.08)}
  .code{font-size:64px;font-weight:800;line-height:1;color:var(--vert);letter-spacing:2px}
  .code span{color:var(--rouge)}
  h1{font-size:22px;margin:14px 0 8px}
  p{color:var(--mute);margin:0 0 20px;line-height:1.5}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a{display:inline-block;padding:11px 18px;border-radius:10px;text-decoration:none;font-weight:600}
  .p{background:var(--vert);color:#fff}
  .s{border:1px solid var(--vert);color:var(--vert)}
</style>
</head>
<body>
<main>
  <div class="code">4<span>0</span>4</div>
  <h1>Page introuvable</h1>
  <p>Cette page n'existe pas ou a été déplacée. Retrouvez toute l'actualité numérique en Algérie sur l'accueil.</p>
  <div class="actions">
    <a class="p" href="/">Retour à l'accueil</a>
    <a class="s" href="/revue/">Revue de presse</a>
  </div>
</main>
</body>
</html>
