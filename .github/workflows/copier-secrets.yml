name: TEMPORAIRE — copie des secrets vers le moteur

# Programme à usage unique (29/09) : copie les secrets de ce dépôt vers
# bastaps/algeria-tech-moteur. Aucune valeur n'est affichée. Supprimé juste après.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copier:
    runs-on: ubuntu-latest
    steps:
      - name: Copie
        env:
          GH_TOKEN: ${{ secrets.MIGRATION_TOKEN }}
          APIFY_ACTOR: ${{ secrets.APIFY_ACTOR }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
          FB_APP_TOKEN: ${{ secrets.FB_APP_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          VIDEOS_DEPLOY_KEY: ${{ secrets.VIDEOS_DEPLOY_KEY }}
        run: |
          for n in APIFY_ACTOR APIFY_TOKEN DEEPSEEK_API_KEY FACEBOOK_COOKIES FB_APP_TOKEN GEMINI_API_KEY \
                   INSTAGRAM_COOKIES MISTRAL_API_KEY NTFY_TOPIC OPENAI_API_KEY OPENROUTER_API_KEY \
                   PEXELS_API_KEY VIDEOS_DEPLOY_KEY; do
            v="${!n}"
            if [ -n "$v" ]; then
              printf '%s' "$v" | gh secret set "$n" --repo bastaps/algeria-tech-moteur && echo "copié : $n"
            else
              echo "vide, ignoré : $n"
            fi
          done
