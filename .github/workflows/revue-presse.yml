name: Revue de Presse IA — Mise à jour automatique

on:
  schedule:
    # 04:00 UTC = 05:00 Alger (CET, UTC+1, pas de changement d'heure en Algérie)
    - cron: '0 4 * * *'
  workflow_dispatch:
    # Permet de lancer manuellement depuis GitHub Actions

permissions:
  contents: write

jobs:
  update-revue:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Archiver l'édition existante (avant écrasement)
        run: |
          if [ ! -f revue_presse.json ]; then
            echo "ℹ️  Pas de revue existante à archiver."
            exit 0
          fi

          # Lire la date depuis lastUpdated dans le JSON (plus fiable que "yesterday")
          ARCHIVE_DATE=$(node -e "
            try {
              const j = JSON.parse(require('fs').readFileSync('revue_presse.json','utf8'));
              const d = j.lastUpdated;
              if (d && !isNaN(new Date(d).getTime())) {
                console.log(new Date(d).toISOString().substring(0, 10));
              } else { process.exit(1); }
            } catch(e) { process.exit(1); }
          " 2>/dev/null) || ARCHIVE_DATE=$(date -d "yesterday" +%Y-%m-%d)

          echo "📅 Date d'archive détectée : $ARCHIVE_DATE"
          mkdir -p archives

          ARCHIVE_FILE="archives/${ARCHIVE_DATE}.json"
          if [ ! -f "$ARCHIVE_FILE" ]; then
            cp revue_presse.json "$ARCHIVE_FILE"
            echo "✅ Archivé : $ARCHIVE_FILE"
          else
            echo "ℹ️  Archive $ARCHIVE_FILE déjà présente — ignorée (pas d'écrasement)."
          fi

      - name: Générer la revue de presse (Mistral, repli Gemini, repli sans IA)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate_revue.js

      - name: Régénérer articles.json
        run: npm run build

      - name: Commiter et pousser les mises à jour
        run: |
          git config user.name "Algeria Tech Bot"
          git config user.email "bot@algeria-tech.dz"

          # Toujours stager archives/ (même si revue n'a pas changé)
          git add revue_presse.json articles.json
          git add archives/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Aucun changement détecté, pas de commit nécessaire."
          else
            git commit -m "Automatique: Revue de presse IA du $(date +'%d/%m/%Y à %H:%M UTC')"
            git push
          fi
