name: Revue de Presse IA — Mise à jour automatique

on:
  schedule:
    # GitHub retarde les exécutions planifiées de PLUSIEURS HEURES (constaté : 05:07 UTC → 09:57 UTC, 04:00 → ~09:20).
    # On part donc la veille au soir / en pleine nuit : 7 créneaux de 21:07 à 03:07 UTC (22h07 → 04h07 heure d'Alger).
    # Le premier qui s'exécute publie l'édition du jour ; les suivants s'arrêtent (voir generate_revue.js : champ `edition`).
    # Objectif : revue à jour à 06h00 Alger. Filet de sécurité : le site dépose data/revue-demande.json si l'édition est
    # périmée après 06h00 (functions/_middleware.js) → déclenchement immédiat par « push » ci-dessous.
    - cron: '7 21 * * *'
    - cron: '7 22 * * *'
    - cron: '7 23 * * *'
    - cron: '7 0 * * *'
    - cron: '7 1 * * *'
    - cron: '7 2 * * *'
    - cron: '7 3 * * *'
  push:
    paths:
      - 'data/revue-demande.json'
  workflow_dispatch:
    # Permet de lancer manuellement depuis GitHub Actions

concurrency:
  group: revue-presse
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-revue:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Archiver l'édition existante (avant écrasement)
        run: |
          if [ ! -f revue_presse.json ]; then
            echo "ℹ️  Pas de revue existante à archiver."
            exit 0
          fi

          # Lire la date depuis lastUpdated dans le JSON (plus fiable que "yesterday")
          ARCHIVE_DATE=$(node -e "
            try {
              const j = JSON.parse(require('fs').readFileSync('revue_presse.json','utf8'));
              const d = j.lastUpdated;
              if (d && !isNaN(new Date(d).getTime())) {
                console.log(new Date(d).toISOString().substring(0, 10));
              } else { process.exit(1); }
            } catch(e) { process.exit(1); }
          " 2>/dev/null) || ARCHIVE_DATE=$(date -d "yesterday" +%Y-%m-%d)

          echo "📅 Date d'archive détectée : $ARCHIVE_DATE"
          mkdir -p archives

          ARCHIVE_FILE="archives/${ARCHIVE_DATE}.json"
          if [ ! -f "$ARCHIVE_FILE" ]; then
            cp revue_presse.json "$ARCHIVE_FILE"
            echo "✅ Archivé : $ARCHIVE_FILE"
          else
            echo "ℹ️  Archive $ARCHIVE_FILE déjà présente — ignorée (pas d'écrasement)."
          fi

      - name: Générer la revue de presse (chaîne Mistral → Gemini → OpenRouter → OpenAI → DeepSeek)
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node generate_revue.js

      - name: Régénérer articles.json
        run: npm run build

      - name: Commiter et pousser les mises à jour
        run: |
          git config user.name "Algeria Tech Bot"
          git config user.email "bot@algeria-tech.dz"

          # Toujours stager archives/ (même si revue n'a pas changé)
          git rm -q --ignore-unmatch data/revue-demande.json || true   # demande déposée par le site : consommée
          git add revue_presse.json articles.json
          git add archives/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "Aucun changement détecté, pas de commit nécessaire."
          else
            git commit -m "Automatique: Revue de presse IA du $(date +'%d/%m/%Y à %H:%M UTC')"
            git push
          fi
