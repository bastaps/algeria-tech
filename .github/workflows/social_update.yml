name: Mise à jour Veille Réseaux Sociaux

on:
  schedule:
    - cron: '0 */3 * * *'  # toutes les 3 heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4 lxml

      - name: Mettre à jour tic_social.json (RSS + sites officiels, sans Facebook ni Apify)
        run: python fetch_social.py --no-translate
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

      - name: Commit et push
        run: |
          git config user.email "action@github.com"
          git config user.name "Algeria Tech Bot"
          git add tic_social.json
          git commit -m "Auto: Veille Réseaux Sociaux [$(date +%H:%M UTC)]" || echo "Pas de changements"
          git pull --rebase origin main
          git push origin main
