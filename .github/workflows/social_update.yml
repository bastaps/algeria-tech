name: Mise à jour Veille Réseaux Sociaux

on:
  schedule:
    - cron: '0 */3 * * *'  # toutes les 3 heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4 lxml curl_cffi

      - name: Mettre à jour tic_social.json
        run: python fetch_social.py --no-translate
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # RSSHub auto-hébergé : déployez sur Vercel (gratuit) puis ajoutez ce secret
          # → https://github.com/DIYgod/RSSHub/blob/master/vercel.json
          # → Ex: https://your-rsshub.vercel.app (sans slash final)
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
          # Cookies de session sociale (jamais le mot de passe — cookie seulement)
          # Extraire depuis Chrome : F12 → Application → Cookies → <domaine>
          # Facebook  : c_user=XXX; xs=YYY; datr=ZZZ; fr=AAA
          # Instagram : sessionid=XXX; csrftoken=YYY
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
          INSTAGRAM_COOKIES: ${{ secrets.INSTAGRAM_COOKIES }}

      - name: Commit et push
        run: |
          git config user.email "action@github.com"
          git config user.name "Algeria Tech Bot"
          git add tic_social.json
          git commit -m "Auto: Veille Réseaux Sociaux [$(date -u +%H:%M) UTC]" || echo "Pas de changements"
          git pull --rebase origin main || true
          git push origin main
