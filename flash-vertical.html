<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Flash Infos 9:16 — Algeria Tech</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}
  .wrap{height:100dvh;display:flex;align-items:center;justify-content:center}
  video{height:100dvh;max-width:100vw;aspect-ratio:9/16;object-fit:contain;background:#000}
  .tap{position:fixed;inset:auto 0 24px 0;text-align:center;font-size:14px;opacity:.8;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <video id="v" src="/videos/flash-widget/flash-9x16-demo.mp4" playsinline controls preload="auto" poster=""></video>
</div>
<div class="tap" id="t">Touchez pour lancer avec le son</div>
<script>
  const v=document.getElementById('v'),t=document.getElementById('t');
  v.addEventListener('play',()=>t.remove());
  v.addEventListener('click',()=>{if(v.paused)v.play()});
</script>
</body>
</html>
